<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Admin · My PYQ Online</title><meta name="robots" content="noindex"><link rel="icon" href="icon.svg">
<style>
:root{--bg:#f1f3f9;--s:#fff;--s2:#f6f7fc;--ink:#121a30;--mut:#5b6684;--line:#dde1ee;--br:#2f4fd8;--bi:#fff;--soft:#e7ebff;--sa:#e9822b;--ok:#13794a;--bad:#c2323a;--sh:0 1px 2px rgba(19,26,48,.05),0 12px 32px -12px rgba(30,45,110,.18);--ui:"Plus Jakarta Sans",system-ui,sans-serif;--rd:"Newsreader",Georgia,serif;color-scheme:light}
body.dark{--bg:#080b16;--s:#111730;--s2:#0d1226;--ink:#edf0fb;--mut:#96a1c6;--line:#232b4c;--br:#8da6ff;--bi:#0a1030;--soft:#1a2352;--sa:#f2a05a;--ok:#56d38d;--bad:#ff8087;--sh:0 16px 40px -16px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
[hidden]{display:none!important}a{color:inherit;text-decoration:none}button,select,input{font:inherit;color:inherit}button{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--s);font-size:13px;font-weight:600;transition:.15s;white-space:nowrap}.btn:hover{border-color:var(--br);background:var(--soft)}.btn.p{background:var(--br);border-color:var(--br);color:var(--bi)}.btn.p:hover{filter:brightness(1.08)}.btn.d{color:var(--bad)}
.w{max-width:1180px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--s) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}nav .w{display:flex;align-items:center;gap:14px;height:62px}
.lg{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em}.lg img{width:32px;height:32px;border-radius:10px}.sp{flex:1}.nl{display:flex;gap:4px}.nl a{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:600;color:var(--mut)}.nl a:hover{background:var(--soft);color:var(--ink)}
.hero{padding:64px 0 36px;text-align:center;background:radial-gradient(900px 340px at 50% -80px,var(--soft),transparent)}
.hero h1{font-size:clamp(34px,6vw,60px);letter-spacing:-.045em;line-height:1.05;margin:0 auto 14px;max-width:780px}.hero h1 em{font:italic 600 1em var(--rd);color:var(--br)}.hero p{color:var(--mut);max-width:560px;margin:0 auto 26px;font-size:17px}
.cta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.join{display:flex;gap:6px}.join input{height:40px;width:130px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--s);letter-spacing:.15em;text-transform:uppercase;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:38px 0 0}.st{background:var(--s);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh)}.st b{display:block;font-size:34px;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums}.st span{font-size:12px;color:var(--mut);font-weight:600}
section{padding:30px 0}h2{font-size:24px;letter-spacing:-.03em;margin:0 0 4px}.sub{color:var(--mut);font-size:14px;margin:0 0 18px}.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}.card{background:var(--s);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh)}
.sc{padding:20px;display:flex;flex-direction:column;gap:12px}.sc h3{margin:0;font-size:18px;letter-spacing:-.02em}.sc small{color:var(--mut);font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--s2);border:1px solid var(--line);color:var(--mut)}.chip.b{background:var(--soft);color:var(--br);border-color:transparent}
.tr{height:6px;border-radius:9px;background:var(--line);overflow:hidden}.tr i{display:block;height:100%;background:linear-gradient(90deg,var(--br),var(--sa));border-radius:9px}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1}.pm{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--mut);min-height:180px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}.goal{display:flex;gap:18px;align-items:center;padding:18px;flex-wrap:wrap;margin-bottom:12px}.goal .t{flex:1;min-width:200px}.goal b{font-size:18px}.goal p{margin:4px 0 0;color:var(--mut);font-size:13px}
.ch2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}.ch2 .card{padding:14px 16px}.ch2 h3{margin:0 0 8px;font-size:13px}.ch2 svg{width:100%;height:auto}
select{height:38px;border:1px solid var(--line);border-radius:11px;background:var(--s);padding:0 10px;font-size:13px}
.tb{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{font-size:11px;color:var(--mut);background:var(--s2)}td small{color:var(--mut)}
.empty{padding:40px;text-align:center;color:var(--mut)}.note{font-size:12px;color:var(--mut)}
footer{padding:34px 0 60px;color:var(--mut);font-size:12px;text-align:center}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:13px;font-size:13px;font-weight:600;z-index:50}
.av{width:30px;height:30px;border-radius:50%;background:var(--br);color:var(--bi);display:grid;place-items:center;font-weight:800;font-size:12px}
@media(max-width:760px){.stats,.pg{grid-template-columns:1fr 1fr}.ch2{grid-template-columns:1fr}.nl{display:none}.hero{padding:40px 0 20px}.btn{height:44px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.foot{border-top:1px solid var(--line);background:var(--s);padding:28px 20px;font-size:14px;margin-top:30px}.fw{max-width:1180px;margin:auto;display:grid;grid-template-columns:2fr 1fr 1.5fr;gap:24px}.foot a,.foot span{display:block;color:var(--mut);margin:3px 0}.foot a:hover{color:var(--br)}.foot p{margin:4px 0;color:var(--mut)}.fine{max-width:1180px;margin:20px auto 0!important;font-size:12px}@media(max-width:640px){.fw{grid-template-columns:1fr}}
.srch{height:38px;border:1px solid var(--line);border-radius:11px;background:var(--s);padding:0 12px;min-width:170px}.ngrp{padding:18px 20px;margin-bottom:14px}.ngrp h3{margin:0 0 6px;font-size:17px}.nch{margin:16px 0 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}.note-i{border-top:1px solid var(--line);padding:12px 0}.nm{display:flex;gap:8px;align-items:center;color:var(--mut)}.np{margin:4px 0;font-size:13px;color:var(--mut)}.nt{white-space:pre-wrap}.ned{width:100%;border:1px solid var(--line);border-radius:11px;padding:10px;background:var(--s2);color:var(--ink);font:inherit}

.tabs{display:flex;gap:6px;margin:22px 0 16px}.tabs button.on{background:var(--br);color:var(--bi);border-color:var(--br)}.act{display:flex;gap:6px}.act .btn{height:34px;padding:0 12px}.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;padding:16px;align-items:end}.frm label{font-size:12px;font-weight:600;color:var(--mut);display:grid;gap:4px}.frm input,.frm select{height:40px;border:1px solid var(--line);border-radius:11px;background:var(--s);padding:0 10px}.gate{padding:40px;text-align:center;margin-top:30px}h3.t{margin:22px 0 8px}
</style><script src="config.js"></script><script src="shared.js"></script></head><body>
<nav><div class="w"><a class="lg" href="index.html"><img src="icon.svg" alt="">Admin</a><div class="nl"><a href="index.html">← Home</a></div><span class="sp"></span><span id="acct"></span></div></nav>
<main class="w"><div class="card gate" id="gate">Loading…</div>
<div id="app" hidden><div class="tabs"><button class="btn on" data-t="subs">Subjects</button><button class="btn" data-t="rep">Reports</button><button class="btn" data-t="ov">Overview</button></div>
<section id="t-subs"><h2>Subjects</h2><p class="sub">Live subjects appear for everyone. “Upcoming” ones show as coming soon. Changing a file bumps its version so devices refresh once.</p>
<div class="card frm"><label>Name<input id="aN" placeholder="e.g. Indian Geography"></label><label>Subtitle<input id="aS" placeholder="Edition / source"></label><label>Status<select id="aSt"><option>live</option><option>upcoming</option><option>hidden</option></select></label><label>ETA (upcoming)<input id="aE" placeholder="e.g. Dec 2026"></label><label>Question bank (.json)<input id="aF" type="file" accept=".json"></label><button class="btn p" id="aGo">Add subject</button></div>
<div class="card tb" style="margin-top:14px" id="subT"></div><h3 class="t">Imported on this device (via Excel)</h3><div class="card tb" id="locT"></div><input type="file" id="rF" accept=".json" hidden></section>
<section id="t-rep" hidden><div class="hd"><div><h2>Question reports</h2><p class="sub" id="repSub"></p></div><button class="btn" id="repCsv">Export CSV</button></div><div class="card tb" id="repT"></div></section>
<section id="t-ov" hidden><h2>Overview</h2><div class="pg" id="ov"></div></section></div></main><div class="toast" id="toast" hidden></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4500)};
const sb=()=>QM.client(),slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');let ROWS=[],REP=[],MAN=[],PICK=null;
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));['subs','rep','ov'].forEach(t=>$('t-'+t).hidden=t!==b.dataset.t)};
async function boot(){await QM.init();const g=$('gate');$('app').hidden=true;g.hidden=false;
 if(!QM.enabled){g.textContent='Supabase is not configured in config.js.';return}
 $('acct').innerHTML=QM.user?'<button class="btn" id="so">Sign out</button>':'';if($('so'))$('so').onclick=()=>QM.signOut();
 if(!QM.user){g.innerHTML='<b>Admin sign-in</b><br>Use the Google account that was made admin.<br><br><button class="btn p" id="gsi">Continue with Google</button>';$('gsi').onclick=()=>QM.signIn();return}
 if(!QM.isAdmin){g.innerHTML='<b>Not an admin account</b><br>'+esc(QM.user.email)+' has no admin access. Run the admin SQL for this email in Supabase.';return}
 g.hidden=true;$('app').hidden=false;await loadAll()}
async function loadAll(){try{MAN=(await(await fetch('data/manifest.json')).json()).subjects}catch(e){MAN=[]}
 const[s,r,st]=await Promise.all([sb().from('subjects').select('*').order('sort').order('created_at'),sb().from('reports').select('*').order('created_at',{ascending:false}).limit(1000),sb().rpc('admin_stats')]);
 ROWS=s.data||[];REP=r.data||[];await drawSubs();drawRep();const d=st.data||{},c=k=>ROWS.filter(x=>x.status===k).length;
 $('ov').innerHTML=[['Users with synced data',d.users??'–'],['Open reports',d.reports_open??'–'],['Live subjects',c('live')+MAN.filter(m=>!ROWS.some(x=>x.id===m.id)).length],['Upcoming',c('upcoming')]].map(([k,v])=>`<div class="st"><b style="font-size:28px">${v}</b><span>${k}</span></div>`).join('')}
async function drawSubs(){
 const cl=ROWS.map(r=>`<tr data-id="${esc(r.id)}"><td><b>${esc(r.name)}</b><br><small>${esc(r.subtitle||'')}${r.eta?' · ETA '+esc(r.eta):''}</small></td><td><select data-st>${['live','upcoming','hidden'].map(x=>`<option ${x===r.status?'selected':''}>${x}</option>`).join('')}</select></td><td>${r.chapters||0} ch · ${(r.questions||0).toLocaleString()} q · ${(r.pyq||0).toLocaleString()} PYQ</td><td>v${r.version}</td><td class="act"><button class="btn" data-ed>Edit</button><button class="btn" data-up>Replace file</button><button class="btn d" data-rm>Delete</button></td></tr>`).join('');
 const bi=MAN.filter(m=>!ROWS.some(r=>r.id===m.id)).map(m=>`<tr data-b="${esc(m.id)}"><td><b>${esc(m.name)}</b><br><small>Built-in · served from GitHub</small></td><td><span class="chip">live</span></td><td>${m.chapters} ch · ${m.questions.toLocaleString()} q · ${m.pyq.toLocaleString()} PYQ</td><td>repo</td><td class="act"><button class="btn" data-mv>Move to cloud</button><button class="btn d" data-hd>Hide</button></td></tr>`).join('');
 $('subT').innerHTML=`<table><tr><th>Subject</th><th>Status</th><th>Content</th><th>Ver</th><th></th></tr>${cl}${bi}</table>`;
 const loc=await QM.kvKeys('subj:'),rows=[];for(const k of loc){const d=await QM.kvGet(k);if(d&&d.questions)rows.push(`<tr data-k="${esc(k)}"><td><b>${esc(d.title||k)}</b></td><td>${d.chapters.length} ch · ${d.questions.length.toLocaleString()} q</td><td class="act"><button class="btn p" data-pub>Publish to library</button></td></tr>`)}
 $('locT').innerHTML=rows.length?`<table>${rows.join('')}</table>`:'<div class="empty">Nothing imported on this device. Import an Excel file via <a href="test.html?add=1"><u>the test portal</u></a>, then publish it here.</div>'}
async function publish({id,name,subtitle,status,eta,data}){const row=ROWS.find(r=>r.id===id);
 if(!data||!Array.isArray(data.chapters)||!Array.isArray(data.questions)){toast('Not a valid bank: it needs “chapters” and “questions”.');return false}
 const path=id+'.json',pyq=data.questions.filter(q=>q.examTags&&q.examTags.length).length;
 const up=await sb().storage.from('banks').upload(path,new Blob([JSON.stringify(data)],{type:'application/json'}),{upsert:true,contentType:'application/json'});if(up.error){toast('Upload failed: '+up.error.message);return false}
 const{error}=await sb().from('subjects').upsert({id,name,subtitle:subtitle||'',status,eta:eta||null,chapters:data.chapters.length,questions:data.questions.length,pyq,version:row?row.version+1:1,path,updated_at:new Date().toISOString()});
 if(error){toast(error.message);return false}toast('Published “'+name+'”.');await loadAll();return true}
const readJson=f=>f.text().then(JSON.parse);
$('aGo').onclick=async()=>{const name=$('aN').value.trim();if(!name)return toast('Enter a name.');const id=slug(name),f=$('aF').files[0];
 if(!f){const{error}=await sb().from('subjects').upsert({id,name,subtitle:$('aS').value.trim(),status:'upcoming',eta:$('aE').value.trim()||null});if(error)return toast(error.message);toast('Added as upcoming (no file yet).');await loadAll();return}
 try{const ok=await publish({id,name,subtitle:$('aS').value.trim(),status:$('aSt').value,eta:$('aE').value.trim(),data:await readJson(f)});if(ok){['aN','aS','aE'].forEach(i=>$(i).value='');$('aF').value=''}}catch(e){toast('That file is not valid JSON.')}};
$('subT').onclick=async e=>{const tr=e.target.closest('tr');if(!tr)return;const id=tr.dataset.id,r=ROWS.find(x=>x.id===id);
 if(e.target.closest('[data-ed]')){const name=prompt('Name',r.name);if(name==null)return;const sub=prompt('Subtitle',r.subtitle||''),eta=prompt('ETA (for upcoming)',r.eta||''),so=prompt('Sort order (lower = earlier)',r.sort??100);const{error}=await sb().from('subjects').update({name:name.trim()||r.name,subtitle:sub||'',eta:eta||null,sort:+so||100,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else loadAll()}
 else if(e.target.closest('[data-up]')){PICK=r;$('rF').click()}
 else if(e.target.closest('[data-rm]')){if(!confirm('Delete “'+r.name+'” for everyone? Users keep their own progress, but the subject disappears.'))return;if(r.path)await sb().storage.from('banks').remove([r.path]);const{error}=await sb().from('subjects').delete().eq('id',id);if(error)toast(error.message);else{toast('Deleted.');loadAll()}}
 else if(e.target.closest('[data-mv]')){const m=MAN.find(x=>x.id===tr.dataset.b);toast('Uploading…');try{await publish({id:m.id,name:m.name,subtitle:m.subtitle,status:'live',data:await(await fetch('data/'+m.id+'.json')).json()})}catch(x){toast('Could not read the built-in file.')}}
 else if(e.target.closest('[data-hd]')){const m=MAN.find(x=>x.id===tr.dataset.b);if(!confirm('Hide “'+m.name+'” from everyone?'))return;const{error}=await sb().from('subjects').upsert({id:m.id,name:m.name,subtitle:m.subtitle,status:'hidden'});if(error)toast(error.message);else loadAll()}};
$('subT').onchange=async e=>{if(!e.target.matches('[data-st]'))return;const id=e.target.closest('tr').dataset.id,{error}=await sb().from('subjects').update({status:e.target.value,updated_at:new Date().toISOString()}).eq('id',id);if(error)toast(error.message);else{toast('Status updated.');loadAll()}};
$('rF').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f||!PICK)return;try{await publish({id:PICK.id,name:PICK.name,subtitle:PICK.subtitle,status:PICK.status,eta:PICK.eta,data:await readJson(f)})}catch(x){toast('That file is not valid JSON.')}};
$('locT').onclick=async e=>{const tr=e.target.closest('tr');if(!tr||!e.target.closest('[data-pub]'))return;const d=await QM.kvGet(tr.dataset.k);const name=d.title||tr.dataset.k.slice(5);await publish({id:slug(name),name,subtitle:d.subtitle||d.source||'',status:'live',data:d})};
function drawRep(){$('repSub').textContent=`${REP.filter(r=>r.status==='open').length} open · ${REP.length} total`;
 $('repT').innerHTML=REP.length?`<table><tr><th>When</th><th>Subject</th><th>Q</th><th>Issue</th><th>Note</th><th>Question</th><th>Status</th><th></th></tr>${REP.map(r=>`<tr><td>${new Date(r.created_at).toLocaleDateString()}</td><td>${esc(r.subject_name)}</td><td>${esc(r.qno)}</td><td>${esc(r.reason)}</td><td style="white-space:normal;max-width:240px">${esc(r.note)}</td><td style="white-space:normal;max-width:300px"><small>${esc(r.prompt)}</small></td><td><span class="chip ${r.status==='open'?'b':''}">${r.status}</span></td><td><button class="btn" data-r="${r.id}">${r.status==='open'?'Resolve':'Reopen'}</button></td></tr>`).join('')}</table>`:'<div class="empty">No reports yet.</div>'}
$('repT').onclick=async e=>{const b=e.target.closest('[data-r]');if(!b)return;const r=REP.find(x=>x.id==b.dataset.r);await sb().from('reports').update({status:r.status==='open'?'resolved':'open'}).eq('id',r.id);loadAll()};
$('repCsv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',c=['created_at','status','subject_name','chapter','qno','reason','note','prompt','qid'],t=[c.join(','),...REP.map(r=>c.map(k=>q(r[k])).join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download='reports.csv';a.click()};
QM.listen(e=>{if(e==='auth')boot()});boot();
</script></body></html>
